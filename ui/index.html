<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>India Election Intelligence Agent</title>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#0f1117; color:#e0e0e0; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

header { background:#1a1d2e; padding:14px 24px; border-bottom:1px solid #2d2d3d; flex-shrink:0; }
header h1 { font-size:18px; font-weight:600; color:#fff; }
header span { font-size:12px; color:#666; }

.main { display:flex; flex:1; overflow:hidden; }

/* LEFT - examples + trace */
.left-panel { width:260px; background:#1a1d2e; border-right:1px solid #2d2d3d; padding:16px; overflow-y:auto; flex-shrink:0; display:flex; flex-direction:column; gap:14px; }
.section-title { font-size:11px; color:#555; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }
.examples { display:flex; flex-direction:column; gap:5px; }
.example-btn { background:#0f1117; border:1px solid #2d2d3d; border-radius:6px; color:#bbb; padding:7px 10px; font-size:12px; cursor:pointer; text-align:left; transition:all 0.2s; }
.example-btn:hover { border-color:#4f6ef7; color:#fff; }
.trace-box { background:#0f1117; border:1px solid #2d2d3d; border-radius:8px; padding:10px; font-size:12px; color:#888; white-space:pre-line; min-height:60px; line-height:1.8; }

/* CENTER */
.center-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }

/* Input area at top center */
.input-area { padding:20px 60px 0; flex-shrink:0; }
.input-row { display:flex; gap:10px; align-items:flex-end; }
textarea { flex:1; background:#1a1d2e; border:1px solid #2d2d3d; border-radius:10px; color:#e0e0e0; padding:12px 16px; font-size:14px; resize:none; height:56px; outline:none; transition:border 0.2s; font-family:'Segoe UI',sans-serif; }
textarea:focus { border-color:#4f6ef7; }
#ask-btn { background:#4f6ef7; color:white; border:none; border-radius:10px; padding:0 24px; height:56px; font-size:15px; font-weight:600; cursor:pointer; white-space:nowrap; transition:background 0.2s; }
#ask-btn:hover { background:#3d5ce0; }
#ask-btn:disabled { background:#2d2d3d; cursor:not-allowed; color:#666; }

/* Results */
.results-area { flex:1; overflow-y:auto; padding:20px 60px; display:flex; flex-direction:column; gap:16px; }
.card { background:#1a1d2e; border:1px solid #2d2d3d; border-radius:10px; padding:16px; }
.card-title { font-size:11px; color:#666; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; }
.answer-text { font-size:14px; line-height:1.7; color:#e0e0e0; white-space:pre-wrap; }
.table-wrap { overflow-x:auto; max-height:250px; overflow-y:auto; }
.data-table { width:100%; border-collapse:collapse; font-size:12px; }
.data-table th { background:#0f1117; color:#777; padding:7px 12px; text-align:left; border-bottom:1px solid #2d2d3d; font-weight:500; position:sticky; top:0; }
.data-table td { padding:7px 12px; border-bottom:1px solid #1e2130; color:#ccc; }
.data-table tr:hover td { background:#1e2130; }
#chart-container { width:100%; height:320px; }
.placeholder { text-align:center; color:#333; padding:60px 20px; font-size:14px; }

/* RIGHT - SQL */
.right-panel { width:260px; background:#1a1d2e; border-left:1px solid #2d2d3d; padding:16px; overflow-y:auto; flex-shrink:0; }
.sql-box { background:#0f1117; border:1px solid #2d2d3d; border-radius:6px; padding:10px; font-family:'Courier New',monospace; font-size:11px; color:#7ec8e3; white-space:pre-wrap; word-break:break-all; line-height:1.6; max-height:400px; overflow-y:auto; }

.spinner { display:inline-block; width:16px; height:16px; border:2px solid #4f6ef7; border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; margin-right:6px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>🗳️ India Election Intelligence Agent</h1>
  <span>Multi-agent system — SQL + Wikipedia + News + RAG + Visualization</span>
</header>

<div class="main">

  <!-- LEFT -->
  <div class="left-panel">
    <div>
      <div class="section-title">Examples</div><br>
      <div class="examples">
        <button class="example-btn" onclick="setExample(this)">Who won Varanasi in 2019?</button>
        <button class="example-btn" onclick="setExample(this)">Show voter turnout trend in Varanasi across all elections</button>
        <button class="example-btn" onclick="setExample(this)">Tell me about Narendra Modi</button>
        <button class="example-btn" onclick="setExample(this)">What did the 2019 budget say about farmers?</button>
        <button class="example-btn" onclick="setExample(this)">BJP vs INC seats in 2019 Lok Sabha</button>
        <button class="example-btn" onclick="setExample(this)">Who won Varanasi in 2019 and what is its history?</button>
        <button class="example-btn" onclick="setExample(this)">Latest news about Rahul Gandhi</button>
        <button class="example-btn" onclick="setExample(this)">Defence spending in budget speeches over the years</button>
      </div>
    </div>
    <div>
      <div class="section-title">🤖 Agents Called</div><br>
      <div class="trace-box" id="trace">—</div>
    </div>
  </div>

  <!-- CENTER -->
  <div class="center-panel">
    <div class="input-area">
      <div class="input-row">
        <textarea id="question" placeholder="Ask anything about Indian elections... (Enter to send)"></textarea>
        <button id="ask-btn" onclick="askQuestion()">Ask</button>
      </div>
    </div>
    <div class="results-area" id="results-area">
      <div class="placeholder" id="placeholder">Ask a question to get started</div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right-panel">
    <div class="section-title" style="margin-bottom:10px">Generated SQL</div>
    <div class="sql-box" id="sql-box">—</div>
  </div>

</div>

<script>
function setExample(btn) {
  document.getElementById('question').value = btn.textContent;
  document.getElementById('question').focus();
}

async function askQuestion() {
  const question = document.getElementById('question').value.trim();
  if (!question) return;

  const btn = document.getElementById('ask-btn');
  const resultsArea = document.getElementById('results-area');
  const trace = document.getElementById('trace');
  const sqlBox = document.getElementById('sql-box');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  trace.textContent = 'Running agents...';
  sqlBox.textContent = '...';
  resultsArea.innerHTML = '<div class="placeholder"><span class="spinner"></span> Processing...</div>';

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await res.json();

    if (data.error) {
      resultsArea.innerHTML = `<div class="card"><div class="answer-text" style="color:#ff6b6b">${data.error}</div></div>`;
      return;
    }

    trace.textContent = data.trace || '—';
    sqlBox.textContent = data.sql || '—';

    let html = '';

    if (data.answer) {
      html += `<div class="card">
        <div class="card-title">Answer</div>
        <div class="answer-text">${data.answer}</div>
      </div>`;
    }

    if (data.chart_json) {
      html += `<div class="card">
        <div class="card-title">📈 Visualization</div>
        <div id="chart-container"></div>
      </div>`;
    }

    if (data.table) {
      html += `<div class="card">
        <div class="card-title">📊 Data Table</div>
        <div class="table-wrap">${data.table}</div>
      </div>`;
    }

    resultsArea.innerHTML = html || '<div class="placeholder">No results returned</div>';

    if (data.chart_json) {
      const chartData = JSON.parse(data.chart_json);
      const layout = Object.assign({}, chartData.layout, {
        paper_bgcolor: '#1a1d2e',
        plot_bgcolor: '#0f1117',
        font: { color: '#e0e0e0' },
        margin: { t:30, r:20, b:40, l:50 }
      });
      Plotly.react('chart-container', chartData.data, layout, { responsive:true });
    }

  } catch(e) {
    resultsArea.innerHTML = `<div class="card"><div class="answer-text" style="color:#ff6b6b">Error: ${e.message}</div></div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Ask';
  }
}

document.getElementById('question').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    askQuestion();
  }
});
</script>
</body>
</html>
